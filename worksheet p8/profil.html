<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">MARVEL STUDIOS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
    <h1 id="nama-halaman">MARVEL STUDIOS</h1>
    <p id="deskripsi"></p>
    <nav aria-label="Navigasi utama">
        <a href="#home">HOME</a>
        <a href="#daftar-film">DAFTAR FILM</a>
        <a href="#karakter-pameran">KARAKTER &amp; PAMERAN</a>
    </nav>
</header>

<main id="home">
    <section id="profil">
        <h2 id="judul-profil"></h2>
        <p id="kalimat-perkenalan"></p>
        <p><strong>Keahlian:</strong> <span id="keahlian"></span></p>
        <p><strong>Jumlah proyek:</strong> <span id="jumlah-proyek"></span></p>
    </section>

    <section id="daftar-film">
        <h2>Daftar Film Marvel Studios</h2>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>No</th><th>Judul Film</th><th>Sinopsis</th>
                        <th>Tahun Rilis</th><th>Karakter/Pameran</th><th>Status</th>
                    </tr>
                </thead>
                <tbody id="tabel-proyek"></tbody>
            </table>
        </div>
    </section>

    <section id="karakter-pameran">
        <h2>Karakter &amp; Pameran</h2>
        <div class="galeri-karakter">
            <figure class="card-gambar">
                <img src="images.jpg" alt="Karakter Iron Man" />
                <figcaption>POSTER FILM MARVEL</figcaption>
            </figure>
            <figure class="card-gambar">
                <img src="oIfnevRiENDR2IBE31FoFIUWFiMXQgBgGxEk2A~tplv-tiktokx-origin.jpg" alt="Karakter Avengers" />
                <figcaption>KARAKTER AVANGERS</figcaption>
            </figure>
            <figure class="card-gambar">
                <img src="thumb-1920-1286361.jpg" alt="Pameran Marvel" />
                <figcaption>FOTO ANGGOTA AVANGERS</figcaption>
            </figure>
        </div>
        <p id="ringkasan-selesai"></p>
        <p id="hasil-find"></p>
    </section>
</main>

<footer>
    <p>&copy; 2026 MARVEL STUDIOS</p>
    <p>Dibuat oleh Nuzula Firmansyah - NIM 25523137</p>
</footer>

<script src="js/app.js" defer></script>
</body>
</html>
